<!doctype html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <title>css position</title>
   <style>
div{
width: 250px;
height: 250px;
background: #000;
margin: 50px;
}
#static{
    background-color: limegreen; position: static;
}
#sticky{
    background-color: aqua; position: sticky;
}
#relative{
    background-color: lightcoral; position: relative; left: 123px; top: -103px;z-index: -14;
}
    #fixed{
    background-color: rebeccapurple; position: fixed; left: 200px;
}
#absolute{
    background-color: teal; position: absolute;left: 321px; top: -27px;
}

   </style>


    
</head>

<body>
    <div id="static"></div>
    <div id="sticky"></div>
    <div id="relative"></div>
    <div id="fixed"></div>
    <div id="absolute"></div>



</body>




</html>
